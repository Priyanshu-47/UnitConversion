name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UnitConversion.sln

      - name: Build
        run: dotnet build UnitConversion.sln --no-restore -c Release

      - name: Test
        run: dotnet test UnitConversion.sln --no-build -c Release --logger "console;verbosity=normal"
